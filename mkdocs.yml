# Docs site. docs/index.html is the hand-built landing page and is copied as-is
# except for the skill table, which is filled from skills/*/SKILL.md frontmatter
# (docs/hooks/skill_catalog.py). MkDocs renders the guide under /guide/ and
# generates one page per skill (docs/hooks/skill_pages.py). Guide pages can pull
# sections of README.md and other repo files with `<!-- include: FILE#Heading -->`
# (docs/hooks/repo_sections.py). Build: see docs/requirements.txt.
strict: true
site_name: Vital Skills
site_description: Agent skills for Health & Life Sciences workflows on Databricks
site_url: https://databricks-industry-solutions.github.io/vital-skills/
repo_url: https://github.com/databricks-industry-solutions/vital-skills
repo_name: vital-skills
edit_uri: ""
copyright: Licensed under the Databricks License

exclude_docs: |
  hooks/
  overrides/
  requirements.txt

hooks:
  - docs/hooks/skill_pages.py
  - docs/hooks/repo_sections.py

extra_css:
  - guide/stylesheets/extra.css

extra:
  homepage: ./

theme:
  name: material
  custom_dir: docs/overrides
  logo: guide/assets/vitalskills.png
  favicon: guide/assets/databricks-logo.svg
  font:
    text: DM Sans
    code: DM Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: vital/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: vital/sun
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The Skills entry is expanded at build time into the catalog plus one page per skill.
nav:
  - Overview: guide/index.md
  - Setup: guide/setup.md
  - Skills: guide/skills/index.md
  - Evaluation: guide/evaluation.md
  - Contributing: guide/contributing.md
  - FAQ: guide/faq.md
  - Links: guide/links.md
  - Changelog: guide/CHANGELOG.md
